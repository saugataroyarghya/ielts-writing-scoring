[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ielts-scoring"
version = "0.1.0"
description = "Reproducible ModernBERT essay-scoring experiments"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<2.12",
  "transformers==4.57.6",
  "huggingface-hub==0.36.0",
  "safetensors>=0.6,<0.8",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<1.9",
  "pyarrow>=18,<24",
  "requests>=2.32,<3",
  "pyzipper==0.3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
